[tool.poetry]
name = "budgetpal"
version = "0.1.0"
description = "A modern CLI budget planner with beautiful TUI"
authors = ["Budget Pal <budget@example.com>"]
readme = "README.md"
packages = [{include = "budgetpal", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
textual = "^0.47.1"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.0"
aiosqlite = "^0.19.0"
alembic = "^1.13.0"
rich = "^13.7.0"
click = "^8.1.0"
python-dateutil = "^2.8.0"
plotext = "^5.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.7.0"
ipdb = "^0.13.0"

[tool.poetry.scripts]
budgetpal = "budgetpal.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "RUF"]
ignore = ["S101"]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"